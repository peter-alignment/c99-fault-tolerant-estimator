name: Auto Archive GitHub Traffic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run traffic archiver
        env:
          # 关键点：这里必须使用我们刚才存入 Secrets 的 CUSTOM_PAT！
          GITHUB_TOKEN: ${{ secrets.CUSTOM_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/archive_traffic.py

      - name: Commit and push changes if history updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d "data" ]; then
            git add data/
            git diff --staged --quiet || (git commit -m "chore: auto-archive daily GitHub traffic stats" && git push origin HEAD:main)
          else
            echo "Data directory not created, skipping."
          fi
