name: Auto Archive GitHub Traffic

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# 显式声明仓库读写权限，解决 exit code 128 推送被拒问题
permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run traffic archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/archive_traffic.py

      - name: Commit and push changes if history updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add data/
          git diff --staged --quiet || (git commit -m "chore: auto-archive daily GitHub traffic stats" && git push)
