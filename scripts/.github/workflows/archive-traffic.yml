name: Auto Archive GitHub Traffic

on:
  schedule:
    # 每天 UTC 时间 00:00（北京时间早上 8:00）自动运行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许您在网页端手动点击按钮测试运行

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run traffic archiver
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: python scripts/archive_traffic.py

      - name: Commit and push changes if history updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore: auto-archive daily GitHub traffic stats" && git push)
